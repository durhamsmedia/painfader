openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Painfader DMX Controller API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dmx
    description: DMX controller operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dmx/state:
    get:
      operationId: getDmxState
      tags: [dmx]
      summary: Get full DMX state
      responses:
        "200":
          description: Current DMX state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/config:
    get:
      operationId: getDmxConfig
      tags: [dmx]
      summary: Get Art-Net config
      responses:
        "200":
          description: DMX configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxConfig"
    put:
      operationId: updateDmxConfig
      tags: [dmx]
      summary: Update Art-Net config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmxConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxConfig"

  /dmx/mode:
    put:
      operationId: setMode
      tags: [dmx]
      summary: Set operating mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModeInput"
      responses:
        "200":
          description: Mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/fan:
    put:
      operationId: setFan
      tags: [dmx]
      summary: Control the fan (Entour Cyclone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FanInput"
      responses:
        "200":
          description: Fan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/led-matrix:
    put:
      operationId: setLedMatrix
      tags: [dmx]
      summary: Control the LED matrix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedMatrixInput"
      responses:
        "200":
          description: LED matrix updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/led-strips:
    put:
      operationId: setLedStrips
      tags: [dmx]
      summary: Control the LED strips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedStripsInput"
      responses:
        "200":
          description: LED strips updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/disc:
    put:
      operationId: setDisc
      tags: [dmx]
      summary: Control the plexiglass disc drive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscInput"
      responses:
        "200":
          description: Disc updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/pain-fader:
    put:
      operationId: setPainFader
      tags: [dmx]
      summary: Set pain fader position (0-4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PainFaderInput"
      responses:
        "200":
          description: Pain fader updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/scene:
    put:
      operationId: loadScene
      tags: [dmx]
      summary: Load a preset scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "200":
          description: Scene loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/blackout:
    post:
      operationId: blackout
      tags: [dmx]
      summary: Blackout all channels
      responses:
        "200":
          description: All channels zeroed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/hardware-fader:
    post:
      operationId: hardwareFaderInput
      tags: [dmx]
      summary: Receive position from physical hardware fader
      description: |
        POST this from a microcontroller (Arduino, Raspberry Pi, etc.) when the physical fader moves.
        Automatically applies the configured preset for that position and starts the idle timer when position returns to 0.
        Example: POST /api/dmx/hardware-fader  { "position": 2 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardwareFaderInput"
      responses:
        "200":
          description: Fader position applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DmxState"

  /dmx/presets:
    get:
      operationId: getPresets
      tags: [dmx]
      summary: Get all fader position presets
      responses:
        "200":
          description: All presets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetsState"

  /dmx/presets/{position}:
    put:
      operationId: updatePreset
      tags: [dmx]
      summary: Save a preset for a fader position (0-4) or idle
      parameters:
        - name: position
          in: path
          required: true
          schema:
            type: string
          description: "Fader position: 0, 1, 2, 3, 4, or idle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaderPresetInput"
      responses:
        "200":
          description: Preset saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetsState"

  /dmx/presets/{position}/capture:
    post:
      operationId: capturePreset
      tags: [dmx]
      summary: Capture current live state as a preset
      parameters:
        - name: position
          in: path
          required: true
          schema:
            type: string
          description: "Fader position: 0, 1, 2, 3, 4, or idle"
      responses:
        "200":
          description: Current state captured as preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetsState"

  /dmx/preset-timer:
    put:
      operationId: updatePresetTimer
      tags: [dmx]
      summary: Configure the idle timer
      description: When the spring returns the fader to 0, the idle timer counts down and fires the idle preset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetTimerInput"
      responses:
        "200":
          description: Timer config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetsState"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DmxState:
      type: object
      required:
        - mode
        - fan
        - ledMatrix
        - ledStrips
        - disc
        - painFader
        - channels
        - artnetConnected
        - idleTimer
        - hardwareLastSeen
      properties:
        mode:
          type: string
          enum: [idle, experience]
        fan:
          $ref: "#/components/schemas/FanState"
        ledMatrix:
          $ref: "#/components/schemas/LedMatrixState"
        ledStrips:
          $ref: "#/components/schemas/LedStripsState"
        disc:
          $ref: "#/components/schemas/DiscState"
        painFader:
          $ref: "#/components/schemas/PainFaderState"
        channels:
          type: array
          items:
            type: integer
        artnetConnected:
          type: boolean
        idleTimer:
          type: object
          required: [enabled, timerSeconds, remaining, triggered]
          properties:
            enabled:
              type: boolean
            timerSeconds:
              type: integer
            remaining:
              type: ["number", "null"]
            triggered:
              type: boolean
        hardwareLastSeen:
          type: ["integer", "null"]

    DmxConfig:
      type: object
      required:
        - host
        - universe
        - port
        - refreshRate
      properties:
        host:
          type: string
        universe:
          type: integer
        port:
          type: integer
        refreshRate:
          type: integer

    DmxConfigInput:
      type: object
      properties:
        host:
          type: string
        universe:
          type: integer
        port:
          type: integer
        refreshRate:
          type: integer

    ModeInput:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum: [idle, experience]

    FanState:
      type: object
      required:
        - speed
        - enabled
        - channel
      properties:
        speed:
          type: integer
          minimum: 0
          maximum: 255
        enabled:
          type: boolean
        channel:
          type: integer

    FanInput:
      type: object
      properties:
        speed:
          type: integer
          minimum: 0
          maximum: 255
        enabled:
          type: boolean

    LedMatrixState:
      type: object
      required:
        - r
        - g
        - b
        - brightness
        - pattern
        - enabled
        - channels
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
        brightness:
          type: integer
          minimum: 0
          maximum: 255
        pattern:
          type: integer
          minimum: 0
          maximum: 255
        enabled:
          type: boolean
        channels:
          type: object
          required: [r, g, b, brightness, pattern]
          properties:
            r: { type: integer }
            g: { type: integer }
            b: { type: integer }
            brightness: { type: integer }
            pattern: { type: integer }

    LedMatrixInput:
      type: object
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
        brightness:
          type: integer
          minimum: 0
          maximum: 255
        pattern:
          type: integer
          minimum: 0
          maximum: 255
        enabled:
          type: boolean

    LedStripsState:
      type: object
      required:
        - strip1
        - strip2
      properties:
        strip1:
          $ref: "#/components/schemas/LedStripState"
        strip2:
          $ref: "#/components/schemas/LedStripState"

    LedStripState:
      type: object
      required:
        - r
        - g
        - b
        - brightness
        - enabled
        - channels
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
        brightness:
          type: integer
          minimum: 0
          maximum: 255
        enabled:
          type: boolean
        channels:
          type: object
          required: [r, g, b, brightness]
          properties:
            r: { type: integer }
            g: { type: integer }
            b: { type: integer }
            brightness: { type: integer }

    LedStripsInput:
      type: object
      properties:
        strip1:
          $ref: "#/components/schemas/LedStripInput"
        strip2:
          $ref: "#/components/schemas/LedStripInput"
        sync:
          type: boolean

    LedStripInput:
      type: object
      properties:
        r:
          type: integer
          minimum: 0
          maximum: 255
        g:
          type: integer
          minimum: 0
          maximum: 255
        b:
          type: integer
          minimum: 0
          maximum: 255
        brightness:
          type: integer
          minimum: 0
          maximum: 255
        enabled:
          type: boolean

    DiscState:
      type: object
      required:
        - speed
        - direction
        - enabled
        - channel
      properties:
        speed:
          type: integer
          minimum: 0
          maximum: 255
        direction:
          type: string
          enum: [cw, ccw, stop]
        enabled:
          type: boolean
        channel:
          type: integer

    DiscInput:
      type: object
      properties:
        speed:
          type: integer
          minimum: 0
          maximum: 255
        direction:
          type: string
          enum: [cw, ccw, stop]
        enabled:
          type: boolean

    PainFaderState:
      type: object
      required:
        - position
        - dmxValue
        - channel
      properties:
        position:
          type: integer
          minimum: 0
          maximum: 4
        dmxValue:
          type: integer
          minimum: 0
          maximum: 255
        channel:
          type: integer

    PainFaderInput:
      type: object
      required:
        - position
      properties:
        position:
          type: integer
          minimum: 0
          maximum: 4

    SceneInput:
      type: object
      required:
        - scene
      properties:
        scene:
          type: string
          enum: [idle, warmup, experience_low, experience_mid, experience_high, blackout]

    HardwareFaderInput:
      type: object
      required:
        - position
      properties:
        position:
          type: integer
          minimum: 0
          maximum: 4
          description: Physical fader position sent by the hardware controller

    FaderPreset:
      type: object
      required:
        - name
        - fan
        - ledMatrix
        - ledStrip1
        - ledStrip2
        - disc
      properties:
        name:
          type: string
        fan:
          type: object
          required: [speed, enabled]
          properties:
            speed: { type: integer, minimum: 0, maximum: 255 }
            enabled: { type: boolean }
        ledMatrix:
          type: object
          required: [r, g, b, brightness, pattern, enabled]
          properties:
            r: { type: integer, minimum: 0, maximum: 255 }
            g: { type: integer, minimum: 0, maximum: 255 }
            b: { type: integer, minimum: 0, maximum: 255 }
            brightness: { type: integer, minimum: 0, maximum: 255 }
            pattern: { type: integer, minimum: 0, maximum: 255 }
            enabled: { type: boolean }
        ledStrip1:
          type: object
          required: [r, g, b, brightness, enabled]
          properties:
            r: { type: integer, minimum: 0, maximum: 255 }
            g: { type: integer, minimum: 0, maximum: 255 }
            b: { type: integer, minimum: 0, maximum: 255 }
            brightness: { type: integer, minimum: 0, maximum: 255 }
            enabled: { type: boolean }
        ledStrip2:
          type: object
          required: [r, g, b, brightness, enabled]
          properties:
            r: { type: integer, minimum: 0, maximum: 255 }
            g: { type: integer, minimum: 0, maximum: 255 }
            b: { type: integer, minimum: 0, maximum: 255 }
            brightness: { type: integer, minimum: 0, maximum: 255 }
            enabled: { type: boolean }
        disc:
          type: object
          required: [speed, direction, enabled]
          properties:
            speed: { type: integer, minimum: 0, maximum: 255 }
            direction: { type: string, enum: [cw, ccw, stop] }
            enabled: { type: boolean }

    FaderPresetInput:
      type: object
      properties:
        name:
          type: string
        fan:
          type: object
          properties:
            speed: { type: integer, minimum: 0, maximum: 255 }
            enabled: { type: boolean }
        ledMatrix:
          type: object
          properties:
            r: { type: integer, minimum: 0, maximum: 255 }
            g: { type: integer, minimum: 0, maximum: 255 }
            b: { type: integer, minimum: 0, maximum: 255 }
            brightness: { type: integer, minimum: 0, maximum: 255 }
            pattern: { type: integer, minimum: 0, maximum: 255 }
            enabled: { type: boolean }
        ledStrip1:
          type: object
          properties:
            r: { type: integer, minimum: 0, maximum: 255 }
            g: { type: integer, minimum: 0, maximum: 255 }
            b: { type: integer, minimum: 0, maximum: 255 }
            brightness: { type: integer, minimum: 0, maximum: 255 }
            enabled: { type: boolean }
        ledStrip2:
          type: object
          properties:
            r: { type: integer, minimum: 0, maximum: 255 }
            g: { type: integer, minimum: 0, maximum: 255 }
            b: { type: integer, minimum: 0, maximum: 255 }
            brightness: { type: integer, minimum: 0, maximum: 255 }
            enabled: { type: boolean }
        disc:
          type: object
          properties:
            speed: { type: integer, minimum: 0, maximum: 255 }
            direction: { type: string, enum: [cw, ccw, stop] }
            enabled: { type: boolean }

    PresetsState:
      type: object
      required:
        - positions
        - idlePreset
        - idleTimerSeconds
        - idleTimerEnabled
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/FaderPreset"
          description: Presets for fader positions 0-4 (array index = position)
        idlePreset:
          $ref: "#/components/schemas/FaderPreset"
        idleTimerSeconds:
          type: integer
        idleTimerEnabled:
          type: boolean

    PresetTimerInput:
      type: object
      properties:
        timerSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        enabled:
          type: boolean
